services:
  - type: web
    name: amanda-alves-realtor
    runtime: node
    plan: starter
    buildCommand: npm ci && npx prisma migrate deploy && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: amanda-realtor-db
          property: connectionString
      - key: NODE_VERSION
        value: 22.14.0
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: LEAD_NOTIFICATION_EMAIL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
databases:
  - name: amanda-realtor-db
    plan: basic-256mb
    databaseName: amanda_realtor
    user: amanda_realtor
