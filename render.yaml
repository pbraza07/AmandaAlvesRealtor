services:
  - type: web
    name: amanda-alves-realtor
    runtime: node
    plan: free
    buildCommand: npm ci && npm run render:build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: LEAD_NOTIFICATION_EMAIL
        sync: false
      - key: SITE_PHONE
        sync: false
      - key: SITE_EMAIL
        sync: false
      - key: SITE_INSTAGRAM_URL
        value: https://www.instagram.com/amandaalves.realestate/
      - key: SITE_BROKERAGE_NAME
        value: Agile Group Realty – Justin Noe Group
      - key: SITE_BROKERAGE_CONTACT
        sync: false
      - key: SITE_LICENSE_NUMBER
        value: SL3461857
      - key: SITE_SERVICE_AREAS
        value: Odessa, Lutz, Land O’ Lakes, Wesley Chapel, Dade City, San Antonio, and Brooksville
